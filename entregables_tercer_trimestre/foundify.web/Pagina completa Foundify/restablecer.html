<!DOCTYPE html>
<html lang="es">
<!--inicio del encabezado del documento-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<!--inicio del cuerpo del documento-->
<body>
    <div class="container">
        <div class="form-container">
            <h1>Restablecer Contraseña</h1>
            <p>Ingresa tu correo electrónico para recibir un enlace de restablecimiento de contraseña.</p>
<!-- formulario para ingresar el correo -->
        <form id="formulario">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
            <button type="submit">Enviar Enlace</button>
            <a href="index.html" class="boton">Volver</a>
        </form>
        </div>
    </div>
</body>
</html>
<!--script para mostrar mensaje -->
    <script>
        document.getElementById("formulario").addEventListener("submit", function(event){
        event.preventDefault(); // Evita que se recargue la página
        alert("Si este correo existe en el sistema, recibirás un enlace de recuperación.");
    });
    </script>   

</body>
</html>
