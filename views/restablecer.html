<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundify – Restablecer Contraseña</title>
    <link rel="stylesheet" href="../css/styles1.css" />
</head>

<body>

    <div class="page">

        <header class="brand">
            <div class="logo-placeholder">
                <img src="../assets/imagenes/FoundifyBlancoRecortada.png">
            </div>
            <p class="brand-tagline">Conoce más proyectos</p>
        </header>

        <div class="card">
            <h2 class="card__title">Restablecer Contraseña</h2>
            <p class="card__subtitle">Ingresa tu correo y elige una nueva contraseña</p>

            <form id="restablecer-form" method="POST" action="../php/recuperar.php">

                <div class="field">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
                </div>

                <div class="field">
                    <label for="nueva_password">Nueva contraseña</label>
                    <input type="password" id="nueva_password" name="nueva_password" placeholder="••••••••" required>
                </div>

                <div class="field">
                    <label for="confirmar_password">Confirmar contraseña</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" placeholder="••••••••"
                        required>
                </div>

                <button type="submit" class="btn-primary">Restablecer</button>
            </form>

            <p class="register-hint">
                ¿Ya la recordaste? <a href="../index.html">Inicia sesión aquí</a>
            </p>
        </div>

    </div>

</body>

</html>
